# Rradmon as a server reading MQTT observers. Copy the settings below into
# a file named .env next to this one (it is git-ignored) and put the broker
# password in secret/mqtt_password (also git-ignored), then:
#
#   docker compose up -d
#   docker compose exec rradmon rradmon admin set-password
#
# .env:
#   RRADMON_MQTT_URL=tcp://192.168.1.10:1883
#   RRADMON_MQTT_USER=rradmon
#   RRADMON_PORT=127.0.0.1:8080   # host address for the web UI; 8080 alone opens it to the network

services:
  rradmon:
    build: .
    image: rradmon
    restart: unless-stopped
    command: ["run", "-mqtt", "${RRADMON_MQTT_URL:?set in .env}", "-mqtt-user", "${RRADMON_MQTT_USER:?set in .env}",
              "-mqtt-pass-file", "/run/secrets/mqtt_password", "-quiet"]
    ports:
      - "${RRADMON_PORT:-127.0.0.1:8080}:8080"
    volumes:
      - rradmon-data:/data
    secrets:
      - mqtt_password
    # A local RNode as well: uncomment, set the device, and give the
    # container the device's group (ls -n /dev/ttyUSB0 shows its gid)
    # devices:
    #   - /dev/ttyUSB0
    # group_add:
    #   - "20"
    # and add "-port", "/dev/ttyUSB0" to the command

volumes:
  rradmon-data:

secrets:
  mqtt_password:
    file: ./secret/mqtt_password
